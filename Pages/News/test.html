<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Cards</title>
  <style>
    /* Container for all cards */
    .right-section {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 columns */
      gap: 20px;
      padding: 20px;
    }

    /* Card Styling */
    .card {
      display: flex; /* Using flexbox for side-by-side layout */
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Card Image */
    .card-image {
      width: 8rem; /* Set a fixed width for the image */
      height: 7rem; /* Set a fixed height for the image */
      overflow: hidden;
      margin: 0; 
      margin:  1rem ;/* Ensure no margin around the image */
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures the image fills the container */
      border-radius: 6px; /* Apply 6px border radius to image */
    }

    /* Card Content */
    .card-content {
      flex: 1;
      padding: 20px;
    }

    .card-content h3 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #333;
    }

    .card-content p {
      font-size: 1rem;
      color: #555;
      line-height: 1.5;
    }

    /* Responsive Layout for Mobile */
    @media (max-width: 600px) {
      .right-section {
        grid-template-columns: 1fr; /* 1 column on small screens */
      }
      
      .card {
        flex-direction: column; /* Stack the image and content vertically on small screens */
      }

      .card-image {
        width: 100%; /* Image takes full width on mobile */
        height: auto; /* Height adjusts proportionally */
        border-radius: 6px 6px 0 0; /* Radius on top corners only */
      }
    }
  </style>
</head>
<body>


</body>
</html>
