<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.image-container {
  position: relative;
  display: inline-block;
}

.image {
  width: 100%; /* Adjust based on your requirements */
  display: block;
}

.video-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1; /* Ensure the play button is above other elements */
}

.play-icon {
  color: white;
  font-size: 30px;
}

.content-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
  color: white;
  padding: 20px;
  text-align: center;
  opacity: 0.8; /* Opacity for the bottom part */
  z-index: 0; /* Ensure the overlay is below the play button */
}

.image-info {
  margin-top: 10px;
}

.date, .inline-description, .lorem {
  margin: 5px 0;
  opacity: 0.9; /* Adjust text opacity */
}


    </style>
</head>

</body>
</html>
